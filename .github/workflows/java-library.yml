# Шаблон CI общей Java-библиотеки (payments-platform). PR и main: сборка и тесты.
# Тег vX.Y.Z (совпадает с версией в pom.xml) — публикация этой версии в GitHub Packages.
# Сервисы обновляются на новую версию сами, когда им удобно: меняют версию в своём pom.xml.
name: java-library

on:
  workflow_call:

env:
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: mvn -B -ntp verify

  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Только по тегу: версия в теге и в pom.xml должна совпасть, опубликованную версию не перезаписываем
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Tag matches pom version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Тег $GITHUB_REF_NAME, а в pom.xml $version"; exit 1; }
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -s .mvn/settings.xml deploy -DskipTests

  ok:
    if: always()
    needs: [build, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "CI зелёный"
